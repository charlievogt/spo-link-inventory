name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case before the solution. What are you trying to do that's hard or impossible today?
      placeholder: I want to scan only sites associated with a specific hub, not every site I have access to.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed change
      description: What would you like to see? UI sketch, API shape, config knob — whatever level of detail you have.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you've tried, or other tools that solve the same problem differently.
    validations:
      required: false
